<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamante Negro - Menú Exclusive</title>
    <!-- Luxury Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #050505;
            --card-black: #0f0f0f;
            --gold-metallic: #d4af37;
            --gold-light: #f1d592;
            --text-gold: #c5a059;
            --text-white: #ffffff;
            --text-muted: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.6;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* Pantalla de Carga */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .diamond-loader {
            width: 50px;
            height: 50px;
            background: var(--gold-metallic);
            transform: rotate(45deg);
            animation: pulse-diamond 1.5s ease-in-out infinite;
            box-shadow: 0 0 25px var(--gold-metallic);
            margin-bottom: 30px;
        }

        @keyframes pulse-diamond {
            0%, 100% { transform: rotate(45deg) scale(0.8); opacity: 0.5; }
            50% { transform: rotate(45deg) scale(1.1); opacity: 1; }
        }

        /* Header */
        header {
            padding: 60px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .logo-container {
            width: 200px;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
        }

        .luxury-line {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-metallic), transparent);
            margin: 15px 0;
        }

        /* Navegación Sticky */
        .sticky-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(15px);
            padding: 12px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .sticky-nav::-webkit-scrollbar { display: none; }

        .filter-container {
            display: flex;
            gap: 10px;
            padding: 0 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: var(--text-gold);
            padding: 8px 18px;
            border-radius: 0px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: var(--gold-metallic);
            color: black;
            border-color: var(--gold-metallic);
        }

        /* Menú Grid */
        main {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px 80px;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid-menu { grid-template-columns: 1fr 1fr; }
        }

        /* Tarjeta de Plato Exclusive */
        .plato-card {
            background: var(--card-black);
            border: 1px solid rgba(212, 175, 55, 0.05);
            display: flex;
            height: 140px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .plato-img {
            width: 120px;
            height: 100%;
            flex-shrink: 0;
            background: #0a0a0a;
        }

        .plato-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .plato-info {
            padding: 12px 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
        }

        .plato-header h3 {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            color: var(--gold-light);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .plato-desc {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 300;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .plato-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .precio {
            font-family: 'Playfair Display', serif;
            color: var(--gold-metallic);
            font-weight: 700;
            font-size: 18px;
        }

        .badge-cat {
            font-size: 7px;
            text-transform: uppercase;
            color: var(--text-gold);
            opacity: 0.5;
        }

        .agotado { opacity: 0.4; filter: grayscale(1); }
        .agotado-tag {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            border: 1px solid var(--gold-metallic);
            color: var(--gold-metallic);
            padding: 2px 10px;
            font-size: 9px;
            font-weight: 900;
            background: var(--bg-black);
            z-index: 10;
        }

        footer {
            padding: 50px 20px;
            text-align: center;
            background: #000;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
        }

        .footer-text {
            font-size: 9px;
            color: var(--text-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="diamond-loader"></div>
        <p style="font-size: 9px; letter-spacing: 4px; color: var(--gold-metallic);">DIAMANTE NEGRO</p>
    </div>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/200x100/000/D4AF37?text=DIAMANTE+NEGRO'">
        </div>
        <div class="luxury-line"></div>
        <p class="footer-text" style="opacity: 0.6;">Exclusive Selection</p>
    </header>

    <nav class="sticky-nav">
        <div class="filter-container" id="filters"></div>
    </nav>

    <main>
        <div class="grid-menu" id="menu"></div>
    </main>

    <footer>
        <p class="footer-text">Exclusividad en cada detalle</p>
    </footer>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRgQ-ZRf2h64mfosx951LpKzVI5lIPAOuyb9ocFupCv7PycFK6tfY4tzWoBOOTmBluSXVmgH86YumWY/pub?gid=0&single=true&output=csv';
        
        let allItems = [];

        function formatPrice(val) {
            const num = parseInt(val.toString().replace(/\D/g, ''));
            return isNaN(num) ? `$ ${val}` : `$ ${num.toLocaleString('es-CL')}`;
        }

        function hideLoader() {
            const loader = document.getElementById('loader');
            if(loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }
        }

        async function loadData() {
            // Failsafe: Si después de 3 segundos no hay datos, quitamos el loader igual
            const timeout = setTimeout(hideLoader, 3000);

            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error('Error de red');
                
                const csvText = await response.text();
                
                // Dividir filas con soporte para diferentes formatos de salto de línea
                const rows = csvText.split(/\r?\n/).slice(1);

                allItems = rows.map(row => {
                    // Motor de parseo robusto (el mismo que funcionó en el Fogón)
                    // Soporta tanto comas como puntos y comas (común en Chile)
                    const delimiter = row.includes(';') ? ';' : ',';
                    const cols = row.split(delimiter);

                    if (cols.length < 2) return null;
                    
                    return {
                        categoria: (cols[0] || 'Otros').replace(/^"|"$/g, '').trim(),
                        nombre: (cols[1] || 'Sin Nombre').replace(/^"|"$/g, '').trim(),
                        descripcion: (cols[2] || '').replace(/^"|"$/g, '').trim(),
                        precio: (cols[3] || '0').replace(/^"|"$/g, '').trim(),
                        disponible: (cols[4] || 'SI').replace(/^"|"$/g, '').trim().toUpperCase() === 'SI',
                        imagen: (cols[5] || '').replace(/^"|"$/g, '').trim()
                    };
                }).filter(i => i !== null && i.nombre !== '');

                renderAll();
                clearTimeout(timeout);
                hideLoader();
            } catch (err) {
                console.error("Fallo de carga:", err);
                hideLoader();
            }
        }

        function renderAll() {
            const filterContainer = document.getElementById('filters');
            if (!filterContainer) return;

            const cats = ['Todo', ...new Set(allItems.map(i => i.categoria))];
            
            // Ordenar categorías: Carnes, Tablas, Sandwich primero
            const priority = ['Carnes', 'Tablas', 'Sandwich'];
            const sortedCats = ['Todo', ...priority.filter(p => cats.includes(p)), ...cats.filter(c => !priority.includes(c) && c !== 'Todo').sort()];

            filterContainer.innerHTML = sortedCats.map(cat => `
                <button class="filter-btn ${cat === 'Todo' ? 'active' : ''}" onclick="filterBy('${cat}', this)">
                    ${cat}
                </button>
            `).join('');

            renderMenu('Todo');
        }

        function filterBy(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMenu(cat);
            window.scrollTo({ top: document.querySelector('header').offsetHeight - 20, behavior: 'smooth' });
        }

        function renderMenu(cat) {
            const container = document.getElementById('menu');
            if (!container) return;

            const filtered = cat === 'Todo' ? allItems : allItems.filter(i => i.categoria === cat);

            if (filtered.length === 0) {
                container.innerHTML = `<p style="text-align:center; opacity:0.5; grid-column:1/-1; padding:40px;">No se encontraron platos en esta categoría.</p>`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="plato-card ${!item.disponible ? 'agotado' : ''}">
                    ${!item.disponible ? '<div class="agotado-tag">Agotado</div>' : ''}
                    <div class="plato-img">
                        ${item.imagen ? `<img src="${item.imagen}" alt="${item.nombre}" onerror="this.parentElement.innerHTML='<div style=\'height:100%; display:flex; align-items:center; justify-content:center; color:var(--gold-metallic);\'>✧</div>'">` : `<div style="height:100%; display:flex; align-items:center; justify-content:center; color:var(--gold-metallic);">✧</div>`}
                    </div>
                    <div class="plato-info">
                        <div class="plato-header">
                            <h3>${item.nombre}</h3>
                            <p class="plato-desc">${item.descripcion}</p>
                        </div>
                        <div class="plato-footer">
                            <span class="precio">${formatPrice(item.precio)}</span>
                            <span class="badge-cat">${item.categoria}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.onload = loadData;
    </script>
</body>
</html>
