```html
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

const csvURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRgQ-ZRf2h64mfosx951LpKzVI5lIPAOuyb9ocFupCv7PycFK6tfY4tzWoBOOTmBluSXVmgH86YumWY/pub?output=csv"

let platos=[]
let categoriaActual="TODOS"

const menu=document.getElementById("menu")
const filters=document.getElementById("filters")
const search=document.getElementById("search")

function limpiar(v){
if(!v) return ""
return v.toString().trim()
}

function render(){

let texto=search.value.toLowerCase()

menu.innerHTML=""

platos.forEach(p=>{

if(categoriaActual!="TODOS" && p.categoria!=categoriaActual) return

if(texto.length>=3){

let campo=(p.nombre+" "+p.descripcion).toLowerCase()

if(!campo.includes(texto)) return

}

let card=document.createElement("div")

card.className="card"

if(!p.disponible) card.classList.add("unavailable")

card.innerHTML=`

<img src="${p.imagen}">

<div class="info">

<h3 class="name">${p.nombre}</h3>

<p class="desc">${p.descripcion}</p>

${!p.disponible?'<div class="badge">Próximamente disponible</div>':""}

</div>

`

menu.appendChild(card)

})

}

function crearFiltros(){

let cats=["TODOS"]

platos.forEach(p=>{

if(!cats.includes(p.categoria)) cats.push(p.categoria)

})

filters.innerHTML=""

cats.forEach(cat=>{

let b=document.createElement("div")

b.className="filter"

if(cat=="TODOS") b.classList.add("active")

b.innerText=cat

b.onclick=()=>{

categoriaActual=cat

document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"))

b.classList.add("active")

render()

}

filters.appendChild(b)

})

}

Papa.parse(csvURL,{

download:true,
header:true,
skipEmptyLines:true,

complete:function(results){

platos=results.data.map(r=>{

let categoria=limpiar(r["CATEGORIA"])
let nombre=limpiar(r["NOMBRE"])
let descripcion=limpiar(r["DESCRIPCIÓN"])
let disponibilidad=limpiar(r["DISPONIBILIDAD"])
let imagen=limpiar(r["IMAGEN"])

let disponible=true

if(disponibilidad.toLowerCase()=="no") disponible=false

return{
categoria,
nombre,
descripcion,
imagen,
disponible
}

})

crearFiltros()
render()

}

})

search.addEventListener("input",render)

</script>
```
