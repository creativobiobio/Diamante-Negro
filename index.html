<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamante Negro - Menú Exclusive</title>
    <!-- Fuentes de Lujo -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #050505;
            --card-black: #0f0f0f;
            --gold-metallic: #d4af37; /* Dorado Clásico */
            --gold-light: #f1d592;
            --text-gold: #c5a059;
            --text-white: #ffffff;
            --text-muted: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.6;
            -webkit-tap-highlight-color: transparent;
        }

        /* Pantalla de Carga */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }

        .diamond-loader {
            width: 50px;
            height: 50px;
            background: var(--gold-metallic);
            transform: rotate(45deg);
            animation: pulse-diamond 1.5s ease-in-out infinite;
            box-shadow: 0 0 20px var(--gold-metallic);
            margin-bottom: 30px;
        }

        @keyframes pulse-diamond {
            0%, 100% { transform: rotate(45deg) scale(0.8); opacity: 0.5; }
            50% { transform: rotate(45deg) scale(1.1); opacity: 1; }
        }

        .loader-text {
            font-size: 10px;
            letter-spacing: 5px;
            color: var(--gold-metallic);
            text-transform: uppercase;
            text-align: center;
        }

        /* Header */
        header {
            padding: 60px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .logo-container {
            width: 220px;
            margin-bottom: 20px;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
        }

        .luxury-line {
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-metallic), transparent);
            margin: 20px 0;
        }

        /* Navegación Sticky */
        .sticky-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(15px);
            padding: 20px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .sticky-nav::-webkit-scrollbar { display: none; }

        .filter-container {
            display: flex;
            gap: 15px;
            padding: 0 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--text-gold);
            padding: 10px 25px;
            border-radius: 0px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .filter-btn.active {
            background: var(--gold-metallic);
            color: black;
            border-color: var(--gold-metallic);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        /* Menú Grid */
        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px 100px;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        @media (min-width: 768px) {
            .grid-menu { grid-template-columns: 1fr 1fr; }
        }

        /* Tarjeta de Plato Exclusive */
        .plato-card {
            background: var(--card-black);
            border: 1px solid rgba(212, 175, 55, 0.05);
            display: flex;
            height: 160px;
            transition: all 0.5s ease;
            position: relative;
        }

        .plato-card:hover {
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-5px);
        }

        .plato-img {
            width: 140px;
            height: 100%;
            flex-shrink: 0;
            overflow: hidden;
            border-right: 1px solid rgba(212, 175, 55, 0.1);
        }

        .plato-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1s ease;
        }

        .plato-card:hover .plato-img img {
            transform: scale(1.1);
        }

        .plato-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .plato-header h3 {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: var(--gold-light);
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .plato-desc {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 300;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .plato-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .precio {
            font-family: 'Playfair Display', serif;
            color: var(--gold-metallic);
            font-weight: 700;
            font-size: 20px;
        }

        .badge-cat {
            font-size: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-gold);
            opacity: 0.6;
        }

        /* Agotado */
        .plato-card.agotado {
            filter: grayscale(1);
            opacity: 0.4;
        }

        .agotado-tag {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            background: transparent;
            border: 2px solid var(--gold-metallic);
            color: var(--gold-metallic);
            padding: 5px 15px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            z-index: 5;
        }

        /* Footer */
        footer {
            padding: 80px 20px;
            text-align: center;
            background: #000;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
        }

        .footer-text {
            font-size: 10px;
            color: var(--text-gold);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        #status-msg {
            margin-top: 20px;
            font-size: 9px;
            color: var(--text-muted);
            text-align: center;
            max-width: 80%;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="diamond-loader"></div>
        <p class="loader-text">DIAMANTE NEGRO</p>
        <div id="status-msg">Sincronizando con Google Sheets...</div>
    </div>

    <header>
        <div class="logo-container">
            <!-- El logo se llama logo.png según tus instrucciones -->
            <img src="logo.png" alt="Logo Diamante Negro" onerror="this.src='https://via.placeholder.com/200x120/000000/D4AF37?text=DIAMANTE+NEGRO'">
        </div>
        <div class="luxury-line"></div>
        <p class="footer-text" style="font-size: 8px; opacity: 0.8;">Premium Experience</p>
    </header>

    <nav class="sticky-nav">
        <div class="filter-container" id="category-filters"></div>
    </nav>

    <main>
        <div class="grid-menu" id="menu-items"></div>
    </main>

    <footer>
        <p class="footer-text">Exclusividad en cada detalle</p>
        <p style="font-size: 8px; margin-top: 20px; color: var(--text-muted); letter-spacing: 2px;">DISEÑO & FOTOGRAFÍA GASTRONÓMICA</p>
    </footer>

    <script>
        // URL de tu Google Sheet (CSV) actualizada
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRgQ-ZRf2h64mfosx951LpKzVI5lIPAOuyb9ocFupCv7PycFK6tfY4tzWoBOOTmBluSXVmgH86YumWY/pub?gid=0&single=true&output=csv';
        
        let allItems = [];

        // Datos de respaldo para el entorno de Gemini Canvas (CORS workaround)
        const demoData = [
            { categoria: 'Carnes', nombre: 'Tomahawk Premium', descripcion: 'Corte de hacha madurado 30 días, terminado a las brasas con sal de mina.', precio: '45000', disponible: true, imagen: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=500&q=80' },
            { categoria: 'Carnes', nombre: 'Wagyu A5 Selection', descripcion: 'Láminas de Wagyu con sellado milimétrico y reducción de oporto.', precio: '62000', disponible: true, imagen: 'https://images.unsplash.com/photo-1558030006-450675393462?w=500&q=80' },
            { categoria: 'Tablas', nombre: 'Diamante del Mar', descripcion: 'Ostiones, pinzas de jaiba y camarones ecuatorianos al pilpil de cacho de cabra.', precio: '28900', disponible: true, imagen: 'https://images.unsplash.com/photo-1541529086526-db283c563270?w=500&q=80' },
            { categoria: 'Sandwich', nombre: 'Signature Burger', descripcion: '250g de Angus, queso brie, cebolla caramelizada en miel de ulmo y pan brioche.', precio: '14500', disponible: true, imagen: 'https://images.unsplash.com/photo-1550507992-eb63ffee0847?w=500&q=80' },
            { categoria: 'Sandwich', nombre: 'Clásico Diamante', descripcion: 'Lomo de cerdo, palta hass, tomate orgánico y nuestra mayo secreta.', precio: '12900', disponible: false, imagen: '' }
        ];

        function formatCLP(val) {
            if (!val) return '$ 0';
            const num = parseInt(val.toString().replace(/\D/g, ''));
            return isNaN(num) ? `$ ${val}` : `$ ${num.toLocaleString('es-CL')}`;
        }

        function parseCSV(text) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];
                if (inQuotes) {
                    if (char === '"' && nextChar === '"') { currentField += '"'; i++; }
                    else if (char === '"') inQuotes = false;
                    else currentField += char;
                } else {
                    if (char === '"') inQuotes = true;
                    else if (char === ',') { currentRow.push(currentField); currentField = ''; }
                    else if (char === '\n' || char === '\r') {
                        currentRow.push(currentField);
                        if (currentRow.length > 1 || currentRow[0] !== '') rows.push(currentRow);
                        currentRow = []; currentField = '';
                        if (char === '\r' && nextChar === '\n') i++;
                    } else currentField += char;
                }
            }
            if (currentRow.length || currentField) { currentRow.push(currentField); rows.push(currentRow); }
            return rows;
        }

        async function loadData() {
            const status = document.getElementById('status-msg');
            try {
                // Forzamos un timeout para el fetch
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);

                const response = await fetch(SHEET_URL, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error();
                
                const text = await response.text();
                const dataRows = parseCSV(text).slice(1);

                allItems = dataRows.map(cols => ({
                    categoria: (cols[0] || 'Otros').trim(),
                    nombre: (cols[1] || 'S/N').trim(),
                    descripcion: (cols[2] || '').trim(),
                    precio: (cols[3] || '0').trim(),
                    disponible: (cols[4] || 'SI').trim().toUpperCase() === 'SI',
                    imagen: (cols[5] || '').trim()
                })).filter(i => i.nombre !== 'S/N');

                if (allItems.length === 0) throw new Error();

            } catch (error) {
                console.warn("Entorno restringido detectado. Activando modo demostración.");
                allItems = demoData;
                status.innerHTML = "Mostrando menú (Modo de previsualización activa)";
            } finally {
                renderFilters();
                renderMenu('Todo');
                hideLoader();
            }
        }

        function hideLoader() {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 800);
        }

        function renderFilters() {
            const container = document.getElementById('category-filters');
            const rawCats = [...new Set(allItems.map(i => i.categoria))];
            
            // Prioridad solicitada: Carnes, Tablas, Sandwich
            const priority = ['Carnes', 'Tablas', 'Sandwich'];
            const others = rawCats.filter(c => !priority.includes(c)).sort();
            const finalCats = ['Todo', ...priority.filter(p => rawCats.includes(p)), ...others];

            container.innerHTML = finalCats.map(cat => `
                <button class="filter-btn ${cat === 'Todo' ? 'active' : ''}" onclick="filterBy('${cat}', this)">
                    ${cat.toUpperCase()}
                </button>
            `).join('');
        }

        function filterBy(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMenu(cat);
            window.scrollTo({ top: document.querySelector('header').offsetHeight - 20, behavior: 'smooth' });
        }

        function renderMenu(cat) {
            const container = document.getElementById('menu-items');
            const filtered = cat === 'Todo' ? allItems : allItems.filter(i => i.categoria === cat);
            
            if (filtered.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:var(--text-muted); grid-column: 1/-1;'>No hay elementos disponibles en esta categoría.</p>";
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="plato-card ${!item.disponible ? 'agotado' : ''}">
                    ${!item.disponible ? '<div class="agotado-tag">Agotado</div>' : ''}
                    <div class="plato-img">
                        ${item.imagen ? `<img src="${item.imagen}" alt="${item.nombre}" onerror="this.src='https://via.placeholder.com/300x300/111/D4AF37?text=Diamante'">` : `<div style="height:100%; display:flex; align-items:center; justify-content:center; color:var(--gold-metallic);">✧</div>`}
                    </div>
                    <div class="plato-info">
                        <div class="plato-header">
                            <h3>${item.nombre}</h3>
                            <p class="plato-desc">${item.descripcion}</p>
                        </div>
                        <div class="plato-footer">
                            <span class="precio">${formatCLP(item.precio)}</span>
                            <span class="badge-cat">${item.categoria}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.onload = loadData;
    </script>
</body>
</html>
