<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamante Negro - Menú</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#0b0b0b;
  --card:#141414;
  --accent:#d4af37;
  --accent2:#f1d87a;
  --text:#f5f5f5;
  --muted:#999;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter;
  background:linear-gradient(180deg,#000000,#0e0e0e);
  color:var(--text);
}

/* PANTALLA DE CARGA */

#splash{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:9999;
  transition:opacity 0.8s ease;
}

#splash.oculto{
  opacity:0;
  pointer-events:none;
}

.diamond-wrap{
  position:relative;
  width:80px;
  height:80px;
  margin-bottom:28px;
}

.diamond{
  width:80px;
  height:80px;
  background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent));
  transform:rotate(45deg);
  border-radius:6px;
  animation:pulse 1.5s ease-in-out infinite;
}

.diamond-shine{
  position:absolute;
  top:10px;
  left:10px;
  width:20px;
  height:20px;
  background:rgba(255,255,255,0.4);
  transform:rotate(45deg);
  border-radius:2px;
  animation:shine 1.5s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{ box-shadow:0 0 20px rgba(212,175,55,0.4); transform:rotate(45deg) scale(1); }
  50%{ box-shadow:0 0 50px rgba(212,175,55,0.9); transform:rotate(45deg) scale(1.08); }
}

@keyframes shine{
  0%,100%{ opacity:0.4; }
  50%{ opacity:1; }
}

.splash-title{
  font-family:Cinzel;
  font-size:28px;
  color:var(--accent);
  letter-spacing:4px;
  margin-bottom:6px;
  text-shadow:0 0 20px rgba(212,175,55,0.5);
}

.splash-sub{
  font-size:11px;
  color:#555;
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:40px;
}

.splash-bar{
  width:160px;
  height:2px;
  background:#1a1a1a;
  border-radius:2px;
  overflow:hidden;
}

.splash-bar-inner{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:2px;
  animation:barra 1.8s ease-in-out forwards;
}

@keyframes barra{
  0%{ width:0%; }
  60%{ width:80%; }
  100%{ width:100%; }
}

/* HEADER */

header{
  padding:35px 20px 10px;
  text-align:center;
}

.logo{
  display:block;
  margin:auto;
  width:300px;
  margin-bottom:15px;
  filter:drop-shadow(0 0 8px rgba(212,175,55,0.3));
}

@media(min-width:700px){
  .logo{width:380px;}
}

.search-box{
  max-width:900px;
  margin:0 auto 20px auto;
  padding:0 20px;
}

.search-box input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #333;
  font-size:14px;
  background:#0e0e0e;
  color:white;
}

.search-box input::placeholder{color:#777;}

.category-bar{
  max-width:900px;
  margin:auto;
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px 20px;
}

.cat-btn{
  background:#111;
  border:1px solid #333;
  padding:7px 16px;
  border-radius:20px;
  cursor:pointer;
  font-size:12px;
  white-space:nowrap;
  color:#eee;
  transition:0.25s;
}

.cat-btn:hover{
  border:1px solid var(--accent);
}

.cat-btn.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:black;
  border:none;
}

.menu{
  max-width:900px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns:1fr;
  gap:18px;
}

@media(min-width:700px){
  .menu{grid-template-columns:1fr 1fr;}
}

.card{
  display:flex;
  align-items:center;
  background:linear-gradient(145deg,#121212,#0a0a0a);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.6);
  position:relative;
  border:1px solid #1f1f1f;
}

.card:hover{
  border:1px solid rgba(212,175,55,0.4);
  transform:scale(1.01);
}

.agotado{
  opacity:0.4;
  filter:grayscale(1);
}

.agotado::after{
  content:"AGOTADO";
  position:absolute;
  top:10px;
  right:10px;
  background:#a00000;
  color:white;
  font-size:10px;
  padding:4px 7px;
  border-radius:5px;
}

.img{
  width:120px;
  height:120px;
  background:#111;
  flex-shrink:0;
  align-self:stretch;
}

.img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  padding:13px;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-width:0;
}

.title{
  font-family:Cinzel;
  font-size:17px;
  margin-bottom:5px;
  color:var(--accent);
}

.desc{
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
  min-height:18px;
}

.adicionales{
  font-size:11px;
  color:var(--muted);
  margin-bottom:8px;
  line-height:1.4;
}

.adicionales-label{
  color:var(--accent);
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.5px;
  margin-bottom:2px;
}

.bottom{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:4px;
}

.price{
  font-weight:700;
  font-size:14px;
  color:var(--accent2);
  white-space:nowrap;
}

.badge{
  font-size:9px;
  background:#d4af37;
  padding:3px 6px;
  border-radius:6px;
  color:#000;
  font-weight:600;
  white-space:nowrap;
  line-height:1.3;
}

.precios{
  display:flex;
  flex-direction:column;
  gap:2px;
  align-items:flex-end;
}

.precio-fila{
  display:flex;
  align-items:center;
  gap:5px;
}

.precio-label{
  font-size:10px;
  color:var(--muted);
  white-space:nowrap;
}

.precio-valor{
  font-weight:700;
  font-size:13px;
  color:var(--accent2);
  white-space:nowrap;
}

footer{
  text-align:center;
  padding:45px 20px;
  color:#777;
  font-size:12px;
}

.creativo-link{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-top:25px;
  text-decoration:none;
  transition:0.3s;
}

.creativo-link:hover{opacity:0.7;}

.creativo-logo{
  width:55px;
  border-radius:6px;
  margin-bottom:6px;
}

.creativo-text{
  font-size:10px;
  letter-spacing:2px;
  color:var(--accent);
  font-weight:600;
  text-transform:uppercase;
}

</style>
</head>

<body>

<!-- PANTALLA DE CARGA -->
<div id="splash">
  <div class="diamond-wrap">
    <div class="diamond"></div>
    <div class="diamond-shine"></div>
  </div>
  <div class="splash-title">DIAMANTE NEGRO</div>
  <div class="splash-sub">Curanilahue · Chile</div>
  <div class="splash-bar">
    <div class="splash-bar-inner"></div>
  </div>
</div>

<header>
  <img src="logo.png" class="logo">
  <div class="search-box">
    <input type="text" id="search" placeholder="Buscar en el menú...">
  </div>
</header>

<div class="category-bar" id="cats"></div>
<div class="menu" id="menu"></div>

<footer>
  CURANILAHUE · CHILE
  <a href="https://www.instagram.com/creativobiobio" target="_blank" class="creativo-link">
    <img src="creativo.png" class="creativo-logo">
    <span class="creativo-text">Desarrollado por CREATIVO</span>
  </a>
</footer>

<script>

const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRgQ-ZRf2h64mfosx951LpKzVI5lIPAOuyb9ocFupCv7PycFK6tfY4tzWoBOOTmBluSXVmgH86YumWY/pub?gid=0&single=true&output=csv";

let items=[];

function ocultarSplash(){
  document.getElementById("splash").classList.add("oculto");
}

async function load(){
  const inicio=Date.now();
  try{
    const url=SHEET_URL+"&t="+Date.now();
    const r=await fetch(url);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const t=await r.text();
    const rows=t.split(/\r?\n/).slice(1);
    items=rows.map(row=>{
      try{
        if(!row.trim()) return null;
        const clean=row.split(",").map(x=>x.trim().replace(/^"|"$/g,""));
        if(clean.length<4) return null;
        return{
          cat:        clean[0]||"Otros",
          name:       clean[1]||"",
          desc:       clean[2]||"",
          price:      clean[3]||"0",
          stock:      clean[4]||"SI",
          img:        clean[5]||"",
          etiqueta1:  clean[6]||"",
          precio1:    clean[7]||"",
          etiqueta2:  clean[8]||"",
          precio2:    clean[9]||"",
          adicionales:clean[10]||""
        };
      }catch{
        return null;
      }
    }).filter(Boolean);
    renderCats();
    renderMenu("Todo");
  }catch(e){
    console.error(e);
    document.getElementById("menu").innerHTML=
      '<div style="text-align:center;padding:60px 20px;color:#777">Error al cargar el menú.<br><br>'+
      '<button onclick="location.reload()" style="background:var(--accent);color:#000;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:13px">Reintentar</button></div>';
  }finally{
    // mínimo 1800ms para que el splash se vea completo
    const transcurrido=Date.now()-inicio;
    const espera=Math.max(0,1800-transcurrido);
    setTimeout(ocultarSplash, espera);
  }
}

function renderCats(){
  const cats=[...new Set(items.map(i=>i.cat))];
  const container=document.getElementById("cats");
  container.innerHTML="";
  const all=["Todo",...cats];
  all.forEach(c=>{
    const count=c==="Todo"?items.length:items.filter(i=>i.cat===c).length;
    const btn=document.createElement("button");
    btn.className="cat-btn";
    btn.innerText=c+" ("+count+")";
    btn.onclick=()=>{
      document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      renderMenu(c);
    };
    container.appendChild(btn);
  });
  container.firstChild.classList.add("active");
}

function renderPrecio(i){
  if(i.etiqueta1){
    return`
      <div class="precios">
        <div class="precio-fila">
          <span class="precio-label">${i.etiqueta1}</span>
          <span class="precio-valor">$ ${Number(i.precio1).toLocaleString("es-CL")}</span>
        </div>
        ${i.etiqueta2?`
        <div class="precio-fila">
          <span class="precio-label">${i.etiqueta2}</span>
          <span class="precio-valor">$ ${Number(i.precio2).toLocaleString("es-CL")}</span>
        </div>`:""}
      </div>
    `;
  }
  return`<div class="price">$ ${Number(i.price).toLocaleString("es-CL")}</div>`;
}

function renderMenu(cat){
  const container=document.getElementById("menu");
  let filtered=cat==="Todo"?items:items.filter(i=>i.cat===cat);
  const q=document.getElementById("search").value.toLowerCase();
  if(q){
    filtered=filtered.filter(i=>
      i.name.toLowerCase().includes(q)||
      i.desc.toLowerCase().includes(q)
    );
  }

  filtered.sort((a,b)=>{
    const aOff=a.stock?.toUpperCase()==="NO"?1:0;
    const bOff=b.stock?.toUpperCase()==="NO"?1:0;
    return aOff-bOff;
  });

  container.innerHTML=filtered.map(i=>`
    <div class="card ${i.stock?.toUpperCase()==="NO"?"agotado":""}">
      <div class="img">
        ${i.img?`<img src="${i.img}">`:""}
      </div>
      <div class="info">
        <div>
          <div class="title">${i.name}</div>
          <div class="desc">${i.desc||""}</div>
          ${i.adicionales?`
          <div class="adicionales">
            <div class="adicionales-label">Adicionales</div>
            ${i.adicionales}
          </div>`:""}
        </div>
        <div class="bottom">
          ${renderPrecio(i)}
          <div class="badge">${i.cat}</div>
        </div>
      </div>
    </div>
  `).join("");
}

document.getElementById("search").addEventListener("input",()=>{
  const active=document.querySelector(".cat-btn.active");
  renderMenu(active?active.innerText.split(" (")[0]:"Todo");
});

load();

</script>

</body>
</html>
