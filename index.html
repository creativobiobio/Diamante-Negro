<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamante Negro - Menú</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#0b0b0b;
  --card:#141414;
  --accent:#d4af37;
  --accent2:#f1d87a;
  --text:#f5f5f5;
  --muted:#999;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter;
  background:linear-gradient(180deg,#000000,#0e0e0e);
  color:var(--text);
}

header{
  padding:35px 20px 10px;
  text-align:center;
}

.logo{
  display:block;
  margin:auto;
  width:300px;
  margin-bottom:15px;
  filter:drop-shadow(0 0 8px rgba(212,175,55,0.3));
}

@media(min-width:700px){
  .logo{width:380px;}
}

.search-box{
  max-width:900px;
  margin:0 auto 20px auto;
  padding:0 20px;
}

.search-box input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #333;
  font-size:14px;
  background:#0e0e0e;
  color:white;
}

.search-box input::placeholder{color:#777;}

.category-bar{
  max-width:900px;
  margin:auto;
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px 20px;
}

.cat-btn{
  background:#111;
  border:1px solid #333;
  padding:7px 16px;
  border-radius:20px;
  cursor:pointer;
  font-size:12px;
  white-space:nowrap;
  color:#eee;
  transition:0.25s;
}

.cat-btn:hover{
  border:1px solid var(--accent);
}

.cat-btn.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:black;
  border:none;
}

.menu{
  max-width:900px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns:1fr;
  gap:18px;
}

@media(min-width:700px){
  .menu{grid-template-columns:1fr 1fr;}
}

.card{
  display:flex;
  background:linear-gradient(145deg,#121212,#0a0a0a);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.6);
  position:relative;
  border:1px solid #1f1f1f;
}

.card:hover{
  border:1px solid rgba(212,175,55,0.4);
  transform:scale(1.01);
}

.agotado{
  opacity:0.4;
  filter:grayscale(1);
}

.agotado::after{
  content:"AGOTADO";
  position:absolute;
  top:10px;
  right:10px;
  background:#a00000;
  color:white;
  font-size:10px;
  padding:4px 7px;
  border-radius:5px;
}

.img{
  width:120px;
  height:120px;
  background:#111;
  flex-shrink:0;
}

.img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  padding:13px;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.title-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
  margin-bottom:5px;
}

.title{
  font-family:Cinzel;
  font-size:17px;
  color:var(--accent);
}

.desc{
  font-size:12px;
  color:var(--muted);
  margin-bottom:10px;
  min-height:18px;
}

.bottom{
  display:flex;
  justify-content:flex-start;
  align-items:flex-end;
}

.price{
  font-weight:700;
  font-size:15px;
  color:var(--accent2);
  white-space:nowrap;
}

.badge{
  font-size:10px;
  background:#d4af37;
  padding:3px 8px;
  border-radius:6px;
  color:#000;
  font-weight:600;
  flex-shrink:0;
}

.precios{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.precio-fila{
  display:flex;
  align-items:center;
  gap:8px;
}

.precio-label{
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
}

.precio-valor{
  font-weight:700;
  font-size:14px;
  color:var(--accent2);
  white-space:nowrap;
}

footer{
  text-align:center;
  padding:45px 20px;
  color:#777;
  font-size:12px;
}

.creativo-link{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-top:25px;
  text-decoration:none;
  transition:0.3s;
}

.creativo-link:hover{opacity:0.7;}

.creativo-logo{
  width:55px;
  border-radius:6px;
  margin-bottom:6px;
}

.creativo-text{
  font-size:10px;
  letter-spacing:2px;
  color:var(--accent);
  font-weight:600;
  text-transform:uppercase;
}

</style>
</head>

<body>

<header>
  <img src="logo.png" class="logo">
  <div class="search-box">
    <input type="text" id="search" placeholder="Buscar en el menú...">
  </div>
</header>

<div class="category-bar" id="cats"></div>
<div class="menu" id="menu"></div>

<footer>
  CURANILAHUE · CHILE
  <a href="https://www.instagram.com/creativobiobio" target="_blank" class="creativo-link">
    <img src="creativo.png" class="creativo-logo">
    <span class="creativo-text">Desarrollado por CREATIVO</span>
  </a>
</footer>

<script>

const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRgQ-ZRf2h64mfosx951LpKzVI5lIPAOuyb9ocFupCv7PycFK6tfY4tzWoBOOTmBluSXVmgH86YumWY/pub?gid=0&single=true&output=csv";

let items=[];

async function load(){
  try{
    const url=SHEET_URL+"&t="+Date.now();
    const r=await fetch(url);
    if(!r.ok) throw new Error("No se pudo cargar");
    const t=await r.text();
    const rows=t.split(/\r?\n/).slice(1);
    items=rows.map(row=>{
      try{
        if(!row.trim()) return null;
        const clean=row.split(",").map(x=>x.trim().replace(/^"|"$/g,""));
        if(clean.length<4) return null;
        return{
          cat:      clean[0]||"Otros",
          name:     clean[1]||"",
          desc:     clean[2]||"",
          price:    clean[3]||"0",
          stock:    clean[4]||"SI",
          img:      clean[5]||"",
          etiqueta1:clean[6]||"",
          precio1:  clean[7]||"",
          etiqueta2:clean[8]||"",
          precio2:  clean[9]||""
        };
      }catch{
        return null;
      }
    }).filter(Boolean);
    renderCats();
    renderMenu("Todo");
  }catch(e){
    console.error(e);
  }
}

function renderCats(){
  const cats=[...new Set(items.map(i=>i.cat))];
  const container=document.getElementById("cats");
  container.innerHTML="";
  const all=["Todo",...cats];
  all.forEach(c=>{
    const count=c==="Todo"?items.length:items.filter(i=>i.cat===c).length;
    const btn=document.createElement("button");
    btn.className="cat-btn";
    btn.innerText=c+" ("+count+")";
    btn.onclick=()=>{
      document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      renderMenu(c);
    };
    container.appendChild(btn);
  });
  container.firstChild.classList.add("active");
}

function renderPrecio(i){
  if(i.etiqueta1){
    return`
      <div class="precios">
        <div class="precio-fila">
          <span class="precio-label">${i.etiqueta1}</span>
          <span class="precio-valor">$ ${Number(i.precio1).toLocaleString("es-CL")}</span>
        </div>
        ${i.etiqueta2?`
        <div class="precio-fila">
          <span class="precio-label">${i.etiqueta2}</span>
          <span class="precio-valor">$ ${Number(i.precio2).toLocaleString("es-CL")}</span>
        </div>`:""}
      </div>
    `;
  }
  return`<div class="price">$ ${Number(i.price).toLocaleString("es-CL")}</div>`;
}

function renderMenu(cat){
  const container=document.getElementById("menu");
  let filtered=cat==="Todo"?items:items.filter(i=>i.cat===cat);
  const q=document.getElementById("search").value.toLowerCase();
  if(q){
    filtered=filtered.filter(i=>
      i.name.toLowerCase().includes(q)||
      i.desc.toLowerCase().includes(q)
    );
  }

  filtered.sort((a,b)=>{
    const aOff=a.stock?.toUpperCase()==="NO"?1:0;
    const bOff=b.stock?.toUpperCase()==="NO"?1:0;
    return aOff-bOff;
  });

  container.innerHTML=filtered.map(i=>`
    <div class="card ${i.stock?.toUpperCase()==="NO"?"agotado":""}">
      <div class="img">
        ${i.img?`<img src="${i.img}">`:""}
      </div>
      <div class="info">
        <div>
          <div class="title-row">
            <div class="title">${i.name}</div>
            <div class="badge">${i.cat}</div>
          </div>
          <div class="desc">${i.desc||""}</div>
        </div>
        <div class="bottom">
          ${renderPrecio(i)}
        </div>
      </div>
    </div>
  `).join("");
}

document.getElementById("search").addEventListener("input",()=>{
  const active=document.querySelector(".cat-btn.active");
  renderMenu(active?active.innerText.split(" (")[0]:"Todo");
});

load();

</script>

</body>
</html>
