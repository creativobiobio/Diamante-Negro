<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diamante Negro - Menú</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">

<style>

:root{
--bg:#0b0b0b;
--card:#161616;
--gold:#d4af37;
--gold-soft:#f0d57a;
--text:#f5f5f5;
--muted:#9c9c9c;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Inter;
background:var(--bg);
color:var(--text);
}

header{
padding:40px 20px 20px;
text-align:center;
background:linear-gradient(#151515,#0b0b0b);
}

.logo-container{
width:160px;
margin:auto;
}

.logo-container img{
width:100%;
filter:drop-shadow(0 8px 20px rgba(0,0,0,0.7));
}

.slogan{
font-size:10px;
letter-spacing:4px;
color:var(--muted);
margin-top:10px;
}

.divider{
width:60px;
height:2px;
background:var(--gold);
margin:15px auto;
}

.sticky-nav{
position:sticky;
top:0;
z-index:100;
background:rgba(10,10,10,0.95);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.05);
padding:15px 0;
overflow-x:auto;
}

.filter-container{
display:flex;
gap:10px;
padding:0 20px;
max-width:900px;
margin:auto;
}

.filter-btn{
background:#1a1a1a;
border:1px solid rgba(255,255,255,0.1);
color:var(--muted);
padding:8px 20px;
border-radius:50px;
font-size:11px;
font-weight:700;
cursor:pointer;
}

.filter-btn.active{
background:var(--gold);
border-color:var(--gold);
color:black;
box-shadow:0 4px 15px rgba(212,175,55,0.4);
}

main{
max-width:900px;
margin:auto;
padding:20px;
}

.grid-menu{
display:grid;
gap:20px;
}

@media(min-width:768px){
.grid-menu{
grid-template-columns:1fr 1fr;
}
}

.plato-card{
background:var(--card);
border-radius:16px;
display:flex;
overflow:hidden;
border:1px solid rgba(255,255,255,0.05);
}

.plato-card.agotado{
opacity:.45;
filter:grayscale(1);
}

.plato-img{
width:120px;
height:120px;
background:#000;
}

.plato-img img{
width:100%;
height:100%;
object-fit:cover;
}

.plato-info{
padding:14px;
flex:1;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.plato-info h3{
font-family:Playfair Display;
font-size:17px;
}

.plato-desc{
font-size:12px;
color:var(--muted);
margin:6px 0;
}

.plato-footer{
display:flex;
justify-content:space-between;
align-items:center;
}

.precio{
color:var(--gold-soft);
font-size:18px;
font-weight:900;
}

.badge-cat{
font-size:9px;
color:var(--gold);
border:1px solid var(--gold);
padding:2px 6px;
border-radius:4px;
}

.agotado-overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.7);
display:flex;
align-items:center;
justify-content:center;
}

.agotado-tag{
color:red;
border:1px solid red;
padding:2px 6px;
font-size:9px;
}

#loader{
position:fixed;
inset:0;
background:black;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:1000;
}

.spinner{
width:40px;
height:40px;
border:3px solid rgba(212,175,55,0.2);
border-top-color:var(--gold);
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

</style>
</head>

<body>

<div id="loader">
<div class="spinner"></div>
<p style="margin-top:15px;color:var(--gold)">Cargando Diamante Negro...</p>
</div>

<header>

<div class="logo-container">
<img src="logo.jpg">
</div>

<div class="divider"></div>

<p class="slogan">Gastronomía & Bar</p>

</header>

<nav class="sticky-nav">
<div class="filter-container" id="category-filters"></div>
</nav>

<main>
<div class="grid-menu" id="menu-items"></div>
</main>

<script>

const SHEET_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRgQ-ZRf2h64mfosx951LpKzVI5lIPAOuyb9ocFupCv7PycFK6tfY4tzWoBOOTmBluSXVmgH86YumWY/pub?gid=0&single=true&output=csv';

let allItems=[];

function formatCLP(val){
const num=parseInt(val.toString().replace(/\D/g,''));
if(isNaN(num))return '$0';
return '$ '+num.toLocaleString('es-CL');
}

function parseCSV(text){

const rows=text.split("\n").map(r=>r.split(","));

return rows;

}

async function loadData(){

const response=await fetch(SHEET_URL);
const data=await response.text();

const parsed=parseCSV(data);

const dataRows=parsed.slice(1);

allItems=dataRows.map(c=>{

if(!c || c.length<2)return null;

return{
categoria:(c[0]||"Otros").trim(),
nombre:(c[1]||"").trim(),
descripcion:(c[2]||"").trim(),
precio:(c[3]||"0").trim(),
disponible:(c[4]||"SI").trim().toUpperCase()==="SI",
imagen:(c[5]||"").trim()
};

}).filter(i=>i);

renderFilters();
renderMenu("Todo");

document.getElementById("loader").style.display="none";

}

function renderFilters(){

const container=document.getElementById("category-filters");

const cats=["Todo",...new Set(allItems.map(i=>i.categoria))];

container.innerHTML=cats.map(cat=>
`<button class="filter-btn ${cat==="Todo"?"active":""}" onclick="filterBy('${cat}',this)">${cat}</button>`
).join("");

}

function filterBy(cat,btn){

document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

renderMenu(cat);

}

function renderMenu(cat){

const container=document.getElementById("menu-items");

const filtered=cat==="Todo"?allItems:allItems.filter(i=>i.categoria===cat);

container.innerHTML=filtered.map(item=>`

<div class="plato-card ${!item.disponible?"agotado":""}">

<div class="plato-img">

${item.imagen?`<img src="${item.imagen}">`:""}

</div>

<div class="plato-info">

<div>

<h3>${item.nombre}</h3>

<p class="plato-desc">${item.descripcion}</p>

</div>

<div class="plato-footer">

<span class="precio">${formatCLP(item.precio)}</span>

<span class="badge-cat">${item.categoria}</span>

</div>

</div>

</div>

`).join("");

}

window.onload=loadData;

</script>

</body>
</html>
