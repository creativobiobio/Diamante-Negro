<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamante Negro - Menú Exclusive</title>
    <!-- Luxury Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #050505;
            --card-black: #0f0f0f;
            --gold: #d4af37;
            --gold-light: #f1d592;
            --white: #ffffff;
            --gray: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-black);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Pantalla de Carga */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(212, 175, 55, 0.1);
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Header */
        header {
            padding: 50px 20px 30px;
            text-align: center;
            background: linear-gradient(to bottom, #111, var(--bg-black));
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .logo-container {
            width: 200px;
            margin: 0 auto 15px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
        }

        .luxury-line {
            width: 80px;
            height: 1px;
            background: var(--gold);
            margin: 15px auto;
        }

        /* Navegación */
        .sticky-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        .sticky-nav::-webkit-scrollbar { display: none; }

        .filter-container {
            display: flex;
            gap: 10px;
            padding: 0 20px;
            justify-content: flex-start;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--gold);
            padding: 8px 18px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-btn.active {
            background: var(--gold);
            color: black;
            border-color: var(--gold);
        }

        /* Grid */
        main {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px 100px;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid-menu { grid-template-columns: 1fr 1fr; }
        }

        /* Card */
        .item-card {
            background: var(--card-black);
            border: 1px solid rgba(212, 175, 55, 0.05);
            display: flex;
            height: 140px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .item-card:hover { transform: translateY(-3px); }

        .item-img {
            width: 120px;
            height: 100%;
            background: #0a0a0a;
            flex-shrink: 0;
        }

        .item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
        }

        .item-info h3 {
            font-family: 'Playfair Display', serif;
            font-size: 17px;
            color: var(--gold-light);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-desc {
            font-size: 10px;
            color: var(--gray);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            color: var(--gold);
            font-weight: 700;
            font-size: 19px;
            font-family: 'Playfair Display', serif;
        }

        /* Agotado */
        .agotado { opacity: 0.4; filter: grayscale(1); }
        .agotado-tag {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-10deg);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 3px 12px;
            font-size: 10px;
            font-weight: 700;
            background: black;
            z-index: 10;
        }

        footer {
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
        }

        .footer-text {
            font-size: 9px;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #demo-badge {
            display: none;
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            padding: 5px 10px;
            font-size: 8px;
            border: 1px solid var(--gold);
            z-index: 1000;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p style="color: var(--gold); font-size: 9px; margin-top: 20px; letter-spacing: 3px; text-transform: uppercase;">Diamante Negro</p>
    </div>

    <div id="demo-badge">MODO PREVISUALIZACIÓN</div>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Diamante Negro" onerror="this.src='https://via.placeholder.com/200x120/000/D4AF37?text=DIAMANTE+NEGRO'">
        </div>
        <div class="luxury-line"></div>
        <p class="footer-text" style="opacity: 0.6;">Menú Exclusive</p>
    </header>

    <nav class="sticky-nav">
        <div class="filter-container" id="category-btns"></div>
    </nav>

    <main>
        <div class="grid-menu" id="menu-grid"></div>
    </main>

    <footer>
        <p class="footer-text">Diamante Negro Exclusive</p>
    </footer>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRgQ-ZRf2h64mfosx951LpKzVI5lIPAOuyb9ocFupCv7PycFK6tfY4tzWoBOOTmBluSXVmgH86YumWY/pub?gid=0&single=true&output=csv';
        
        let allItems = [];

        // DATOS DE MUESTRA (Se activan solo si falla la conexión en Canva)
        const mockData = [
            { categoria: 'Carnes', nombre: 'Tomahawk Premium', descripcion: 'Corte madurado 30 días, terminado a las brasas con mantequilla de trufa.', precio: '45000', disponible: true, imagen: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=500' },
            { categoria: 'Tablas', nombre: 'Diamante del Mar', descripcion: 'Ostiones, camarones al ajillo y pinzas de jaiba con salsa de la casa.', precio: '28900', disponible: true, imagen: 'https://images.unsplash.com/photo-1541529086526-db283c563270?w=500' },
            { categoria: 'Sandwich', nombre: 'Burger Exclusive', descripcion: 'Wagyu, queso brie, cebolla caramelizada y pan brioche artesanal.', precio: '15500', disponible: true, imagen: 'https://images.unsplash.com/photo-1567234665766-4bc58c5a47f4?w=500' },
            { categoria: 'Carnes', nombre: 'Lomo Vetado Angus', descripcion: '350g de carne seleccionada con acompañamiento rústico.', precio: '18900', disponible: false, imagen: '' }
        ];

        function formatPrice(val) {
            const num = parseInt(val.toString().replace(/\D/g, ''));
            return isNaN(num) ? `$ ${val}` : `$ ${num.toLocaleString('es-CL')}`;
        }

        async function loadData() {
            try {
                // Timeout de 2 segundos para no hacer esperar al cliente
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2500);

                const response = await fetch(SHEET_URL, { signal: controller.signal });
                clearTimeout(timeoutId);

                const csvText = await response.text();
                const rows = csvText.split(/\r?\n/).slice(1);
                
                allItems = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (cols.length < 2) return null;
                    return {
                        categoria: cols[0]?.replace(/^"|"$/g, '').trim() || 'Varios',
                        nombre: cols[1]?.replace(/^"|"$/g, '').trim() || '',
                        descripcion: cols[2]?.replace(/^"|"$/g, '').trim() || '',
                        precio: cols[3]?.replace(/^"|"$/g, '').trim() || '0',
                        disponible: (cols[4]?.replace(/^"|"$/g, '').trim() || 'SI').toUpperCase() === 'SI',
                        imagen: cols[5]?.replace(/^"|"$/g, '').trim() || ''
                    };
                }).filter(item => item && item.nombre);

            } catch (error) {
                console.warn("CORS/Network error detected. Loading mock data for preview.");
                allItems = mockData;
                document.getElementById('demo-badge').style.display = 'block';
            } finally {
                initApp();
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }
        }

        function initApp() {
            const btnContainer = document.getElementById('category-btns');
            const uniqueCats = [...new Set(allItems.map(i => i.categoria))];
            
            const priority = ['Carnes', 'Tablas', 'Sandwich'];
            const sortedCats = ['Todos', ...priority.filter(p => uniqueCats.includes(p)), ...uniqueCats.filter(c => !priority.includes(c)).sort()];

            btnContainer.innerHTML = sortedCats.map(cat => `
                <button class="filter-btn ${cat === 'Todos' ? 'active' : ''}" onclick="filterMenu('${cat}', this)">
                    ${cat}
                </button>
            `).join('');

            renderItems('Todos');
        }

        function filterMenu(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderItems(cat);
            window.scrollTo({ top: document.querySelector('header').offsetHeight - 20, behavior: 'smooth' });
        }

        function renderItems(cat) {
            const grid = document.getElementById('menu-grid');
            const filtered = cat === 'Todos' ? allItems : allItems.filter(i => i.categoria === cat);

            grid.innerHTML = filtered.map(item => `
                <div class="item-card ${!item.disponible ? 'agotado' : ''}">
                    ${!item.disponible ? '<div class="agotado-tag">Agotado</div>' : ''}
                    <div class="item-img">
                        ${item.imagen ? `<img src="${item.imagen}" alt="${item.nombre}" onerror="this.src='https://via.placeholder.com/300x300/111/D4AF37?text=Exclusive'">` : `<div style="height:100%; display:flex; align-items:center; justify-content:center; color:var(--gold); font-size:24px;">✧</div>`}
                    </div>
                    <div class="item-info">
                        <div>
                            <h3>${item.nombre}</h3>
                            <p class="item-desc">${item.descripcion}</p>
                        </div>
                        <div class="item-footer">
                            <span class="price">${formatPrice(item.precio)}</span>
                            <span style="font-size:7px; text-transform:uppercase; color:var(--gold); opacity:0.5;">${item.categoria}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.onload = loadData;
    </script>
</body>
</html>
