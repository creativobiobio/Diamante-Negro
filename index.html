<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diamante Negro - Menú</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:#0a0a0a;
color:white;
font-family:Inter;
display:flex;
justify-content:center;
}

.container{
width:100%;
max-width:1100px;
padding:30px;
}

header{
display:flex;
align-items:center;
gap:20px;
margin-bottom:20px;
}

.logo{
width:90px;
height:90px;
background:black;
border-radius:12px;
overflow:hidden;
}

.logo img{
width:100%;

object-fit:cover;
}

.title{

font-size:28px;

}

.search{
margin:20px 0;
}

.search input{
width:100%;
padding:12px;
border-radius:8px;
border:none;
background:#1a1a1a;

font-size:14px;
}

.filters{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

.filter{
padding:8px 14px;
border-radius:30px;
background:#1a1a1a;
cursor:pointer;
font-size:13px;
}

.filter.active{
background:#caa64a;
color:black;
font-weight:600;
}

.grid{
display:grid;
grid-template-columns:1fr;
gap:18px;
}

@media(min-width:700px){
.grid{
grid-template-columns:1fr 1fr;
}
}

.card{
display:flex;
gap:12px;
background:#121212;
padding:12px;
border-radius:12px;
transition:0.2s;
}

.card.unavailable{
opacity:.4;
}

.card img{
width:120px;

}

}

.name{
font-family:Playfair Display;

}

.desc{

color:#bbb;
margin:4px 0;
}

.price{

font-weight:600;
}

.badge{

padding:4px 8px;

margin-top:4px;
}

</style>
</head>

<body>

<div class="container">

<header>
<div class="logo">
<img src="logo.jpg">
</div>
<div class="title">Diamante Negro</div>
</header>

<div class="search">
<input id="search" placeholder="Buscar plato... (mínimo 3 letras)">
</div>

<div id="filters" class="filters"></div>

<div id="menu" class="grid"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

const csvURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRgQ-ZRf2h64mfosx951LpKzVI5lIPAOuyb9ocFupCv7PycFK6tfY4tzWoBOOTmBluSXVmgH86YumWY/pub?output=csv"

let platos=[]
let categoriaActual="TODOS"

const menu=document.getElementById("menu")
const filters=document.getElementById("filters")
const search=document.getElementById("search")

function precioCLP(valor){

let n=Number(valor)

if(isNaN(n))return valor

return "$"+n.toLocaleString("es-CL")

}

function render(){

let texto=search.value.toLowerCase()

menu.innerHTML=""

platos.forEach(p=>{

if(categoriaActual!="TODOS" && p.CATEGORIA!=categoriaActual) return

if(texto.length>=3){

let campo=(p.NOMBRE+" "+p.DESCRIPCION).toLowerCase()

if(!campo.includes(texto)) return

}

let card=document.createElement("div")

card.className="card"

let disponible=p.DISPONIBLE.toLowerCase().trim()

if(disponible=="no" || disponible=="") card.classList.add("unavailable")

card.innerHTML=`

<img src="${p.IMAGEN}">

<div class="info">

<h3 class="name">${p.NOMBRE}</h3>

<p class="desc">${p.DESCRIPCION}</p>

<div class="price">${precioCLP(p.PRECIO)}</div>

${(disponible=="no"||disponible=="")?'<div class="badge">Próximamente disponible</div>':""}

</div>

`

menu.appendChild(card)

})

}

function crearFiltros(){

let cats=["TODOS"]

platos.forEach(p=>{

if(!cats.includes(p.CATEGORIA)) cats.push(p.CATEGORIA)

})

filters.innerHTML=""

cats.forEach(cat=>{

let b=document.createElement("div")

b.className="filter"

if(cat=="TODOS") b.classList.add("active")

b.innerText=cat

b.onclick=()=>{

categoriaActual=cat

document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"))

b.classList.add("active")

render()

}

filters.appendChild(b)

})

}

Papa.parse(csvURL,{

download:true,

header:true,

complete:function(results){

platos=results.data

crearFiltros()

render()

}

})

search.addEventListener("input",render)

</script>

</body>
</html>
