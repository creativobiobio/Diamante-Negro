<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamante Negro - Menú Exclusive</title>
    <!-- Fuentes de Lujo -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505; /* Negro Profundo */
            --card-bg: #0f0f0f;
            --gold: #d4af37;     /* Dorado Metálico */
            --gold-soft: #f1d592;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-tap-highlight-color: transparent;
        }

        /* Pantalla de Carga */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 175, 55, 0.1);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Header Estilo Diamante */
        header {
            padding: 60px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: linear-gradient(to bottom, #111, var(--bg-color));
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .logo-container {
            width: 200px;
            margin-bottom: 20px;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
        }

        .divider {
            width: 80px;
            height: 1px;
            background: var(--gold);
            margin: 20px 0;
        }

        .slogan {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--gold);
            font-weight: 300;
            opacity: 0.8;
        }

        /* Filtros Sticky */
        .sticky-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            padding: 15px 0;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .sticky-nav::-webkit-scrollbar { display: none; }

        .filter-container {
            display: flex;
            gap: 12px;
            padding: 0 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--gold);
            padding: 8px 22px;
            border-radius: 0px; 
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: var(--gold);
            border-color: var(--gold);
            color: black;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        /* Menú Grid */
        main {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px 80px;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        @media (min-width: 768px) {
            .grid-menu { grid-template-columns: 1fr 1fr; }
        }

        /* Tarjeta de Plato */
        .plato-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            border: 1px solid rgba(212, 175, 55, 0.05);
            transition: transform 0.3s ease;
            position: relative;
        }

        .plato-card.agotado {
            opacity: 0.4;
            filter: grayscale(1);
        }

        .plato-img {
            width: 120px;
            min-height: 130px;
            background: #000;
            flex-shrink: 0;
            position: relative;
        }

        .plato-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .plato-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .plato-header h3 {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            margin-bottom: 5px;
            color: var(--gold-soft);
        }

        .plato-desc {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 300;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .plato-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .precio {
            color: var(--gold);
            font-weight: 700;
            font-size: 19px;
            font-family: 'Playfair Display', serif;
        }

        .badge-cat {
            font-size: 7px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--gold);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .agotado-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .agotado-tag {
            color: #ff4757;
            border: 1px solid #ff4757;
            padding: 2px 6px;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            background: black;
        }

        /* Footer */
        footer {
            padding: 60px 20px;
            text-align: center;
            background: #000;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
        }

        .footer-text {
            font-size: 9px;
            color: var(--gold);
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 20px; font-size: 10px; letter-spacing: 4px; color: var(--gold);">DIAMANTE NEGRO...</p>
    </div>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
        </div>
        <div class="divider"></div>
        <p class="slogan">Premium Experience</p>
    </header>

    <nav class="sticky-nav">
        <div class="filter-container" id="category-filters"></div>
    </nav>

    <main>
        <div class="grid-menu" id="menu-items"></div>
    </main>

    <footer>
        <p class="footer-text">Exclusividad en cada detalle</p>
        <p style="font-size: 8px; color: var(--text-muted); margin-top: 15px; opacity: 0.5;">DISEÑO & FOTOGRAFÍA GASTRONÓMICA</p>
    </footer>

    <script>
        // URL de la hoja de cálculo que ya sabemos que funciona
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRgQ-ZRf2h64mfosx951LpKzVI5lIPAOuyb9ocFupCv7PycFK6tfY4tzWoBOOTmBluSXVmgH86YumWY/pub?gid=0&single=true&output=csv';
        
        let allItems = [];

        function formatCLP(val) {
            const num = parseInt(val.toString().replace(/\D/g, ''));
            if (isNaN(num)) return `$ ${val}`;
            return `$ ${num.toLocaleString('es-CL')}`;
        }

        async function loadData() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1);

                allItems = rows.map(row => {
                    // Usando el mismo regex exacto del Fogón
                    const columns = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                    if (!columns || columns.length < 5) return null;
                    
                    const clean = columns.map(c => c.replace(/^"|"$/g, '').trim());
                    return {
                        categoria: clean[0],
                        nombre: clean[1],
                        descripcion: clean[2],
                        precio: clean[3],
                        disponible: clean[4]?.toUpperCase() === 'SI',
                        imagen: clean[5] || null
                    };
                }).filter(i => i !== null);

                renderFilters();
                renderMenu('Todo');
                document.getElementById('loader').style.display = 'none';

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loader').innerHTML = "<p style='color:white'>Error al conectar.</p>";
            }
        }

        function renderFilters() {
            const container = document.getElementById('category-filters');
            const rawCats = [...new Set(allItems.map(i => i.categoria))];
            const priority = ['Carnes', 'Tablas', 'Sandwich'];
            const others = rawCats.filter(c => !priority.includes(c)).sort();
            const finalCats = ['Todo', ...priority.filter(p => rawCats.includes(p)), ...others];

            container.innerHTML = finalCats.map(cat => `
                <button class="filter-btn ${cat === 'Todo' ? 'active' : ''}" onclick="filterBy('${cat}', this)">
                    ${cat}
                </button>
            `).join('');
        }

        function filterBy(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMenu(cat);
            window.scrollTo({ top: document.querySelector('header').offsetHeight - 20, behavior: 'smooth' });
        }

        function renderMenu(cat) {
            const container = document.getElementById('menu-items');
            const filtered = cat === 'Todo' ? allItems : allItems.filter(i => i.categoria === cat);

            container.innerHTML = filtered.map(item => `
                <div class="plato-card ${!item.disponible ? 'agotado' : ''}">
                    <div class="plato-img">
                        ${item.imagen ? `<img src="${item.imagen}" alt="${item.nombre}" onerror="this.style.display='none'">` : '<div style="height:100%; width:100%; display:flex; align-items:center; justify-content:center; opacity:0.1; color:white">✧</div>'}
                        ${!item.disponible ? '<div class="agotado-overlay"><span class="agotado-tag">Agotado</span></div>' : ''}
                    </div>
                    <div class="plato-info">
                        <div class="plato-header">
                            <h3>${item.nombre}</h3>
                            <p class="plato-desc">${item.descripcion}</p>
                        </div>
                        <div class="plato-footer">
                            <span class="precio">${formatCLP(item.precio)}</span>
                            <span class="badge-cat">${item.categoria}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.onload = loadData;
    </script>
</body>
</html>
