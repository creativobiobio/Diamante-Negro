<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamante Negro - Menú Exclusive</title>
    <!-- Fuentes de Lujo -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #050505;
            --card-black: #0f0f0f;
            --gold: #d4af37;
            --gold-light: #f1d592;
            --white: #ffffff;
            --gray: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-black);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Pantalla de Carga */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 3px solid rgba(212, 175, 55, 0.1);
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Header */
        header {
            padding: 50px 20px 30px;
            text-align: center;
            background: linear-gradient(to bottom, #111, var(--bg-black));
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .logo-container {
            width: 200px;
            margin: 0 auto 15px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
        }

        .luxury-line {
            width: 80px;
            height: 1px;
            background: var(--gold);
            margin: 15px auto;
        }

        /* Navegación Sticky */
        .sticky-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            scrollbar-width: none;
        }

        .sticky-nav::-webkit-scrollbar { display: none; }

        .filter-container {
            display: flex;
            gap: 12px;
            padding: 0 20px;
            justify-content: flex-start;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--gold);
            padding: 8px 22px;
            border-radius: 0px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: var(--gold);
            color: black;
            border-color: var(--gold);
        }

        /* Grid */
        main {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px 100px;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid-menu { grid-template-columns: 1fr 1fr; }
        }

        /* Tarjeta de Plato */
        .plato-card {
            background: var(--card-black);
            border: 1px solid rgba(212, 175, 55, 0.05);
            display: flex;
            height: 140px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .plato-card:hover { transform: translateY(-3px); }

        .plato-img {
            width: 120px;
            height: 100%;
            background: #0a0a0a;
            flex-shrink: 0;
            position: relative;
        }

        .plato-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .plato-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
        }

        .plato-header h3 {
            font-family: 'Playfair Display', serif;
            font-size: 17px;
            color: var(--gold-light);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .plato-desc {
            font-size: 10px;
            color: var(--gray);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .plato-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .precio {
            color: var(--gold);
            font-weight: 700;
            font-size: 19px;
            font-family: 'Playfair Display', serif;
        }

        .badge-cat {
            font-size: 7px;
            text-transform: uppercase;
            color: var(--gold);
            opacity: 0.5;
        }

        /* Agotado */
        .plato-card.agotado { opacity: 0.4; filter: grayscale(1); }
        .agotado-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        .agotado-tag {
            color: #ff4757;
            border: 1px solid #ff4757;
            padding: 2px 8px;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            background: black;
        }

        footer {
            padding: 50px 20px;
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
        }

        .footer-text {
            font-size: 9px;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 20px; font-size: 9px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase;">Diamante Negro</p>
    </div>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Logo Diamante Negro" onerror="this.src='https://via.placeholder.com/200x120/000/D4AF37?text=DIAMANTE+NEGRO'">
        </div>
        <div class="luxury-line"></div>
        <p class="footer-text" style="opacity: 0.6;">Premium Experience</p>
    </header>

    <nav class="sticky-nav">
        <div class="filter-container" id="category-filters">
            <!-- Los botones se cargarán aquí -->
        </div>
    </nav>

    <main>
        <div class="grid-menu" id="menu-items">
            <!-- Los platos se cargarán aquí -->
        </div>
    </main>

    <footer>
        <p class="footer-text">Diamante Negro Exclusive</p>
        <p style="font-size: 8px; margin-top: 15px; color: var(--gray); opacity: 0.5; letter-spacing: 1px;">Sincronizado con Google Sheets</p>
    </footer>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRgQ-ZRf2h64mfosx951LpKzVI5lIPAOuyb9ocFupCv7PycFK6tfY4tzWoBOOTmBluSXVmgH86YumWY/pub?gid=0&single=true&output=csv';
        
        let allItems = [];

        function formatCLP(val) {
            if (!val) return '$ 0';
            const num = parseInt(val.toString().replace(/\D/g, ''));
            if (isNaN(num)) return `$ ${val}`;
            return `$ ${num.toLocaleString('es-CL')}`;
        }

        // Función robusta para parsear CSV del script que funciona
        function parseCSV(text) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (inQuotes) {
                    if (char === '"' && nextChar === '"') {
                        currentField += '"';
                        i++;
                    } else if (char === '"') {
                        inQuotes = false;
                    } else {
                        currentField += char;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                    } else if (char === ',') {
                        currentRow.push(currentField);
                        currentField = '';
                    } else if (char === '\r' || char === '\n') {
                        currentRow.push(currentField);
                        if (currentRow.length > 1 || currentRow[0] !== '') {
                            rows.push(currentRow);
                        }
                        currentRow = [];
                        currentField = '';
                        if (char === '\r' && nextChar === '\n') i++;
                    } else {
                        currentField += char;
                    }
                }
            }
            if (currentRow.length > 0 || currentField !== '') {
                currentRow.push(currentField);
                rows.push(currentRow);
            }
            return rows;
        }

        async function loadData() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                
                const parsedRows = parseCSV(data);
                const dataRows = parsedRows.slice(1); // Omitir encabezado

                allItems = dataRows.map(columns => {
                    if (!columns || columns.length < 2 || !columns[1]) return null;
                    
                    return {
                        categoria: (columns[0] || 'Otros').trim(),
                        nombre: (columns[1] || 'Sin nombre').trim(),
                        descripcion: (columns[2] || '').trim(),
                        precio: (columns[3] || '0').trim(),
                        disponible: (columns[4] || 'SI').trim().toUpperCase() === 'SI',
                        imagen: (columns[5] || '').trim()
                    };
                }).filter(i => i !== null);

                renderFilters();
                renderMenu('Todo');
                
                // Ocultar cargador
                document.getElementById('loader').style.display = 'none';

            } catch (error) {
                console.error("Error cargando el menú:", error);
                document.getElementById('loader').innerHTML = "<p style='color:var(--gold); font-size:12px;'>Error al conectar con la carta.</p>";
            }
        }

        function renderFilters() {
            const container = document.getElementById('category-filters');
            const rawCats = [...new Set(allItems.map(i => i.categoria))];
            
            const priority = ['Carnes', 'Tablas', 'Sandwich'];
            const others = rawCats.filter(c => !priority.includes(c)).sort();
            const finalCats = ['Todo', ...priority.filter(p => rawCats.includes(p)), ...others];

            container.innerHTML = finalCats.map(cat => `
                <button class="filter-btn ${cat === 'Todo' ? 'active' : ''}" onclick="filterBy('${cat}', this)">
                    ${cat}
                </button>
            `).join('');
        }

        function filterBy(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMenu(cat);
            window.scrollTo({ top: document.querySelector('header').offsetHeight - 20, behavior: 'smooth' });
        }

        function renderMenu(cat) {
            const container = document.getElementById('menu-items');
            const filtered = cat === 'Todo' ? allItems : allItems.filter(i => i.categoria === cat);

            container.innerHTML = filtered.map(item => `
                <div class="plato-card ${!item.disponible ? 'agotado' : ''}">
                    <div class="plato-img">
                        ${item.imagen ? `<img src="${item.imagen}" alt="${item.nombre}" onerror="this.parentElement.innerHTML='<div style=\'height:100%; width:100%; display:flex; align-items:center; justify-content:center; opacity:0.1\'>✧</div>'">` : '<div style="height:100%; width:100%; display:flex; align-items:center; justify-content:center; opacity:0.1">✧</div>'}
                        ${!item.disponible ? '<div class="agotado-overlay"><span class="agotado-tag">Agotado</span></div>' : ''}
                    </div>
                    <div class="plato-info">
                        <div class="plato-header">
                            <h3>${item.nombre}</h3>
                            <p class="plato-desc">${item.descripcion}</p>
                        </div>
                        <div class="plato-footer">
                            <span class="precio">${formatCLP(item.precio)}</span>
                            <span class="badge-cat">${item.categoria}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.onload = loadData;
    </script>
</body>
</html>
